name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONINTMAXSTRDIGITS: "640"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check src tests tools
      - name: Lint
        run: ruff check src tests tools
      - name: Test
        run: pytest

  package:
    name: Build and replay distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Verify release metadata format
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python tools/build_release_metadata.py \
            --dist-dir dist \
            --examples-dir examples \
            --conformance-dir conformance \
            --output-dir release-check \
            --version "$VERSION" \
            --tag "v$VERSION" \
            --commit "$GITHUB_SHA"
          cd release-check
          sha256sum -c SHA256SUMS.txt
      - name: Test the source distribution
        run: |
          mkdir sdist-check
          tar -xzf dist/*.tar.gz -C sdist-check --strip-components=1
          python -m venv .sdist-venv
          .sdist-venv/bin/python -m pip install -e "sdist-check[dev]"
          test -f sdist-check/spec/ECV_SPEC_V1.md
          test -f sdist-check/spec/ECV_SPEC_V2.md
          test -f sdist-check/docs/THREAT_MODEL.md
          test -f sdist-check/examples/linear-valid.json
          test -f sdist-check/conformance/ECV_CONFORMANCE_V1.json
          test -f sdist-check/action.yml
          test -f sdist-check/tools/build_release_metadata.py
          cd sdist-check
          ../.sdist-venv/bin/python -m pytest
      - name: Install wheel in an isolated environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          .wheel-venv/bin/python -I -m pip check
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$(.wheel-venv/bin/ecv --version)" = "ecv $VERSION"
      - name: Replay committed fixtures from the wheel
        run: |
          .wheel-venv/bin/ecv verify examples/linear-valid.json
          .wheel-venv/bin/ecv verify examples/linear-program-valid.json
          .wheel-venv/bin/ecv verify examples/polynomial-valid.json
          .wheel-venv/bin/ecv verify examples/modular-valid.json
          set +e
          .wheel-venv/bin/ecv verify examples/polynomial-refuted.json
          refuted_exit=$?
          .wheel-venv/bin/ecv verify examples/linear-program-refuted.json
          lp_refuted_exit=$?
          .wheel-venv/bin/ecv verify examples/modular-abstain.json
          abstain_exit=$?
          .wheel-venv/bin/ecv verify examples/linear-invalid.json
          invalid_exit=$?
          set -e
          test "$refuted_exit" -eq 1
          test "$lp_refuted_exit" -eq 1
          test "$abstain_exit" -eq 1
          test "$invalid_exit" -eq 2
          set +e
          command_output=$(.wheel-venv/bin/ecv verify)
          command_exit=$?
          set -e
          test "$command_exit" -eq 2
          COMMAND_OUTPUT="$command_output" python -c 'import json, os; result=json.loads(os.environ["COMMAND_OUTPUT"]); assert result["errors"][0]["code"] == "COMMAND_INPUT_ERROR"'
          .wheel-venv/bin/python -I - <<'PY'
          import json

          from exact_claim_verifier import verify_document

          maximum = "9" * 640
          constant = {"op": "const", "value": maximum}
          document = {
              "spec": "ECV/1",
              "domain": "integer-polynomial-identity",
              "claim": {
                  "kind": "identity",
                  "variables": ["x"],
                  "left": constant,
                  "right": constant,
              },
          }
          result = verify_document(document)
          assert result["verdict"] == "EXACTLY_VERIFIED_IN_DOMAIN"
          json.dumps(result)

          large = "9" * 400
          power = {"op": "pow", "arg": {"op": "const", "value": large}, "exponent": 2}
          document["claim"]["left"] = power
          document["claim"]["right"] = power
          result = verify_document(document)
          assert result["verdict"] == "RESOURCE_LIMIT"
          assert result["errors"][0]["code"] == "INTEGER_RESULT_LIMIT"
          PY
      - name: Replay byte-exact conformance corpus from the wheel
        run: |
          .wheel-venv/bin/python tools/run_conformance.py conformance -- \
            .wheel-venv/bin/ecv verify

  action:
    name: Dogfood composite Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a verified LP certificate
        id: verified
        uses: ./
        with:
          document: examples/linear-program-valid.json
          expected-verdict: EXACTLY_VERIFIED_IN_DOMAIN
          result-path: verified-result.json
      - name: Require an honest refutation
        id: refuted
        uses: ./
        with:
          document: examples/linear-program-refuted.json
          expected-verdict: REFUTED_IN_DOMAIN
          result-path: refuted-result.json
      - name: Check Action outputs
        env:
          VERIFIED: ${{ steps.verified.outputs.verdict }}
          REFUTED: ${{ steps.refuted.outputs.verdict }}
        run: |
          test "$VERIFIED" = EXACTLY_VERIFIED_IN_DOMAIN
          test "$REFUTED" = REFUTED_IN_DOMAIN
          python -c 'import json; assert json.load(open("verified-result.json", encoding="ascii"))["verdict"] == "EXACTLY_VERIFIED_IN_DOMAIN"'
          python -c 'import json; assert json.load(open("refuted-result.json", encoding="ascii"))["verdict"] == "REFUTED_IN_DOMAIN"'
