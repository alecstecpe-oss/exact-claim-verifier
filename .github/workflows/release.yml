name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  PYTHONINTMAXSTRDIGITS: "640"

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run source gates
        run: |
          ruff format --check src tests tools
          ruff check src tests tools
          pytest
      - name: Build distributions
        run: python -m build
      - name: Replay source distribution
        run: |
          mkdir sdist-check
          tar -xzf dist/*.tar.gz -C sdist-check --strip-components=1
          python -m venv .sdist-venv
          .sdist-venv/bin/python -m pip install -e "sdist-check[dev]"
          cd sdist-check
          ../.sdist-venv/bin/python -m pytest
      - name: Replay wheel and committed fixtures
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          test "$(.wheel-venv/bin/ecv --version)" = "ecv ${GITHUB_REF_NAME#v}"
          .wheel-venv/bin/ecv verify examples/linear-valid.json
          .wheel-venv/bin/ecv verify examples/polynomial-valid.json
          .wheel-venv/bin/ecv verify examples/modular-valid.json
          set +e
          .wheel-venv/bin/ecv verify examples/polynomial-refuted.json
          refuted_exit=$?
          .wheel-venv/bin/ecv verify examples/modular-abstain.json
          abstain_exit=$?
          .wheel-venv/bin/ecv verify examples/linear-invalid.json
          invalid_exit=$?
          set -e
          test "$refuted_exit" -eq 1
          test "$abstain_exit" -eq 1
          test "$invalid_exit" -eq 2
          set +e
          command_output=$(.wheel-venv/bin/ecv verify)
          command_exit=$?
          set -e
          test "$command_exit" -eq 2
          COMMAND_OUTPUT="$command_output" python -c 'import json, os; result=json.loads(os.environ["COMMAND_OUTPUT"]); assert result["errors"][0]["code"] == "COMMAND_INPUT_ERROR"'
          .wheel-venv/bin/python -I - <<'PY'
          import json

          from exact_claim_verifier import verify_document

          maximum = "9" * 640
          constant = {"op": "const", "value": maximum}
          document = {
              "spec": "ECV/1",
              "domain": "integer-polynomial-identity",
              "claim": {
                  "kind": "identity",
                  "variables": ["x"],
                  "left": constant,
                  "right": constant,
              },
          }
          result = verify_document(document)
          assert result["verdict"] == "EXACTLY_VERIFIED_IN_DOMAIN"
          json.dumps(result)

          large = "9" * 400
          power = {"op": "pow", "arg": {"op": "const", "value": large}, "exponent": 2}
          document["claim"]["left"] = power
          document["claim"]["right"] = power
          result = verify_document(document)
          assert result["verdict"] == "RESOURCE_LIMIT"
          assert result["errors"][0]["code"] == "INTEGER_RESULT_LIMIT"
          PY
      - name: Build and replay release metadata
        run: |
          python tools/build_release_metadata.py \
            --dist-dir dist \
            --examples-dir examples \
            --output-dir release \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"
          cd release
          sha256sum -c SHA256SUMS.txt
      - name: Generate build provenance attestations
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            release/*.whl
            release/*.tar.gz
            release/ECV_RELEASE_STATEMENT_V1.json
            release/SHA256SUMS.txt
      - name: Create immutable-ready draft and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --draft \
            --generate-notes \
            --title "Exact Claim Verifier $GITHUB_REF_NAME" \
            --verify-tag
          gh release edit "$GITHUB_REF_NAME" --draft=false
