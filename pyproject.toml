[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "exact-claim-verifier"
version = "0.1.0"
description = "Offline reference checker for structured exact claims in declared mathematical domains"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Alecs Amorim", email = "275067713+alecstecpe-oss@users.noreply.github.com" },
]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.12"]

[project.scripts]
ecv = "exact_claim_verifier.cli:main"

[project.urls]
Homepage = "https://github.com/alecstecpe-oss/exact-claim-verifier"
Documentation = "https://github.com/alecstecpe-oss/exact-claim-verifier#readme"
Issues = "https://github.com/alecstecpe-oss/exact-claim-verifier/issues"
Source = "https://github.com/alecstecpe-oss/exact-claim-verifier"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
